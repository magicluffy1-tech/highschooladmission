<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서산 고입 희망 현황</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#F2F5F7; --card:#FFFFFF; --ink:#18212B; --muted:#5B6773; --line:#D8DFE5;
  --brand:#0E4D64; --brand-soft:#DDE9EE;
  --open:#2A5FA8; --open-bg:#E4EDF8;
  --safe:#1E7B4F; --safe-bg:#E1F2E9;
  --edge:#8F5A12; --edge-bg:#F9ECD3;
  --risk:#B3402A; --risk-bg:#F9E2DC;
  --hard:#4F5B67; --hard-bg:#E6EAEE;
  --radius:12px;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;line-height:1.55;font-size:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 48px}
header{padding:6px 0 12px}
h1{font-size:25px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:14px}
.meter{display:inline-flex;align-items:center;gap:8px}
.meter i{display:block;width:90px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter b{display:block;height:100%;background:var(--brand)}
[role=tablist]{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 16px}
[role=tab]{flex:1;font:inherit;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:11px 8px;cursor:pointer;margin-bottom:-1px}
[role=tab][aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
:focus-visible{outline:3px solid var(--open);outline-offset:2px}
.panel[hidden]{display:none}
.tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:6px;font-size:14px;color:var(--muted)}
select,textarea,button.act{font:inherit}
select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:100%}

.cols{display:grid;grid-template-columns:1fr;gap:0 28px;align-items:start}
@media (min-width:760px){.cols{grid-template-columns:1fr 1fr}}
.zone{margin-top:22px}
.zone[data-z="일반계"] .zone-head{border-bottom-color:var(--open)}
.zone[data-z="일반계"] .zone-head h2{color:var(--open)}
.zone-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding:0 2px 8px;border-bottom:2px solid var(--brand);margin-bottom:12px}
.zone-head h2{font-size:20px;margin:0;color:var(--brand)}
.zone-head .when{font-size:14px;color:var(--muted)}
.zone-note{font-size:13px;color:var(--muted);margin:-4px 2px 12px}
.sub{font-size:15px;font-weight:700;color:var(--ink);margin:16px 2px 8px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.name{font-weight:700;font-size:17px;line-height:1.35;word-break:keep-all}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.open{color:var(--open);background:var(--open-bg)}
.chip.safe{color:var(--safe);background:var(--safe-bg)}
.chip.edge{color:var(--edge);background:var(--edge-bg)}
.chip.risk{color:var(--risk);background:var(--risk-bg)}
.chip.hard{color:var(--hard);background:var(--hard-bg)}
.cutrow{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.cutlabel{font-size:13px;color:var(--muted)}
.cut{font-variant-numeric:tabular-nums;font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.01em}
.cut.none{font-size:20px;color:var(--muted);font-weight:600}
.tie{font-size:13px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:2px 18px;margin-top:8px;font-size:14px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{position:relative;height:8px;background:var(--hard-bg);border-radius:4px;margin:12px 0 2px}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--brand)}
.bar span.over{background:var(--risk)}
.bar em{position:absolute;left:66.67%;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12.5px;color:var(--hard);background:var(--hard-bg);border-radius:6px;padding:2px 8px}
.tag.g{color:var(--edge);background:var(--edge-bg);font-weight:600}
.hide-note{font-size:13.5px;color:var(--muted);margin-top:8px}
.legend{font-size:13px;color:var(--muted);margin-top:14px}
.legend em{display:inline-block;width:2px;height:12px;background:var(--ink);vertical-align:-2px;margin:0 4px}

.form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.form label.t{display:block;font-weight:600;margin-bottom:6px}
textarea{width:100%;min-height:120px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px;font-size:14px}
button.act{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 22px;font-weight:600;cursor:pointer}
button.act:hover{background:#0A3A4C}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.err{color:var(--risk);font-size:14px;margin-top:8px}
.student{margin-top:20px}
.student h2{font-size:18px;margin:0 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.student h2 span{font-weight:400;color:var(--muted);font-size:15px}
.res{margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.res .zh{font-size:13px;font-weight:700;color:var(--brand);background:#F4F8FA;padding:6px 14px;border-bottom:1px solid var(--line)}
.li{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.pick{background:#FFF9E8}
.li .l{min-width:0}
.li .n{font-weight:600;line-height:1.35;word-break:keep-all}
.li .s{font-size:13px;color:var(--muted);margin-top:2px}
.li .r{text-align:right;flex:none}
.li .d{font-size:13px;margin-top:4px;color:var(--muted);font-variant-numeric:tabular-nums}
.d.pos{color:var(--safe)} .d.neg{color:var(--risk)}

.more{display:flex;align-items:center;gap:4px;margin-top:10px;background:none;border:0;padding:4px 0;color:var(--brand);font-weight:600;font-size:14px;cursor:pointer}
.more:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.more i{display:inline-block;transition:transform .15s;font-style:normal}
.card.open-d .more i{transform:rotate(180deg)}
.detail{margin-top:10px;padding-top:12px;border-top:1px dashed var(--line)}
.detail h4{font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 8px}
.detail h4:first-child{margin-top:0}
.warn{font-size:13px;color:var(--edge);background:var(--edge-bg);border-radius:8px;padding:7px 10px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kpi{background:#F4F8FA;border-radius:8px;padding:7px 4px;text-align:center}
.kpi span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.kpi b{display:block;font-size:15px;font-variant-numeric:tabular-nums;margin-top:2px}
.hist{display:flex;align-items:flex-end;gap:3px;height:96px;padding-top:16px}
.hb{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.hb u{display:block;width:100%;background:#C9D6DD;border-radius:3px 3px 0 0;text-decoration:none;min-height:2px}
.hb.in u{background:var(--brand)}
.hb.me u{background:#E0A100}
.hb s{font-size:11px;color:var(--muted);text-decoration:none;font-variant-numeric:tabular-nums;line-height:1.2}
.hx{display:flex;gap:3px;margin-top:3px}
.hx span{flex:1;min-width:0;text-align:center;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hl{font-size:12.5px;color:var(--muted);margin-top:8px}
.hl i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px;font-style:normal}
.mine{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mine input{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.mine .out{font-size:14px}
.mine .out b{font-variant-numeric:tabular-nums}
@media (max-width:420px){.kpis{grid-template-columns:repeat(3,1fr)}}
.foot{margin-top:28px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (min-width:600px){.wrap{padding-top:28px}h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>서산 고입 희망 현황</h1>
    <div class="meta" id="meta">불러오는 중…</div>
  </header>

  <div role="tablist" aria-label="화면 선택">
    <button role="tab" id="tab-dash" aria-selected="true" aria-controls="p-dash">고등학교별 컷라인</button>
    <button role="tab" id="tab-look" aria-selected="false" aria-controls="p-look">우리 반 점수 조회</button>
  </div>

  <section class="panel" id="p-dash" role="tabpanel" aria-labelledby="tab-dash">
    <div class="tools">
      <label>정렬
        <select id="sort-dash">
          <option value="set">기본 순서</option>
          <option value="cut">컷라인 높은 순</option>
          <option value="rate">경쟁률 높은 순</option>
        </select>
      </label>
    </div>
    <div id="dash"></div>
    <p class="legend">컷라인은 1지망 지원자를 점수순으로 세웠을 때 일반전형 정원 번째 학생의 점수입니다. 정원에 못 미치면 지원자 중 최저점이며 '미달'로 표시합니다. 막대의 검은 선은 정원(100%) 위치입니다<em></em>.</p>
  </section>

  <section class="panel" id="p-look" role="tabpanel" aria-labelledby="tab-look" hidden>
    <div class="form">
      <label class="t" for="scores">학생 점수</label>
      <textarea id="scores" placeholder="한 줄에 한 명씩 입력하세요.&#10;172.5&#10;3번 158&#10;코드A 136.5"></textarea>
      <p class="hint">'점수'만 쓰거나 '코드(공백)점수' 형식으로 쓰세요. 엑셀에서 복사해 붙여넣어도 됩니다. 이름 대신 번호나 코드를 권장합니다.</p>
      <div class="row">
        <label>희망 고등학교 <select id="pick"><option value="">선택 안 함</option></select></label>
        <label>정렬 <select id="sort-look">
          <option value="chance">합격 가능성 높은 순</option>
          <option value="cut">컷라인 높은 순</option>
        </select></label>
        <button class="act" id="go" type="button">등위 확인</button>
      </div>
      <div class="err" id="look-err" role="alert"></div>
    </div>
    <div id="results"></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script>
const SAFE_RATIO = 0.95, RISK_RATIO = 1.05;
const ZONES = [
  {key: '특성화', title: '특성화고', note: '정원은 일반전형 기준이며, 취업희망자 등 특별전형 지원자는 이 현황에 포함되지 않습니다.'},
  {key: '일반계', title: '일반계고', note: ''}
];
let DATA = null;
const $ = id => document.getElementById(id);
const fmt = n => n == null ? '-' : Number(n).toLocaleString('ko-KR', {maximumFractionDigits: 2});

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v; else if (k === 'text') el.textContent = v; else el.setAttribute(k, v);
  }
  kids.flat().forEach(k => { if (k != null && k !== '') el.append(k instanceof Node ? k : document.createTextNode(k)); });
  return el;
}

fetch('data.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('data.json을 불러오지 못했습니다 (' + r.status + ')'); return r.json(); })
  .then(init)
  .catch(e => { $('meta').textContent = ''; $('meta').append(h('span', {class: 'err', text: e.message})); });

/* 구역 나누기: 특성화 → 일반계 → (구분 없는 경우) */
function zonesOf(schools) {
  const used = new Set();
  const out = [];
  ZONES.forEach(z => {
    const list = schools.filter(s => s.group === z.key);
    if (list.length) { out.push({...z, list}); list.forEach(s => used.add(s)); }
  });
  const rest = schools.filter(s => !used.has(s));
  if (rest.length) out.push({key: '', title: '고등학교', note: '', list: rest});
  out.forEach(z => { z.apply = (z.list.find(s => s.apply) || {}).apply || ''; });
  return out;
}

function init(d) {
  DATA = d;
  DATA.min = d.min ?? 50; DATA.max = d.max ?? 200;
  const m = $('meta'); m.textContent = '';
  m.append(h('span', {text: '마지막 병합 ' + (d.updated || '-')}));
  const pr = d.progress || {};
  if (pr.total) {
    const pct = Math.min(100, Math.round(pr.done / pr.total * 100));
    m.append(h('span', {class: 'meter'}, '입력 ' + pr.done + '/' + pr.total + '학급 (' + pct + '%)',
      h('i', {}, h('b', {style: 'width:' + pct + '%'}))));
  } else if (pr.done) {
    m.append(h('span', {text: '입력 ' + pr.done + '학급'}));
  }
  $('foot').textContent = (d.notice || '참고용 자료입니다.') + ' 입력한 점수는 이 화면에서만 계산되며 저장·전송되지 않습니다. 입력이 덜 끝났다면 컷라인과 등위가 달라질 수 있습니다.';
  zonesOf(d.schools).forEach(z => {
    const og = h('optgroup', {label: z.title});
    z.list.forEach(s => og.append(h('option', {value: s.name, text: s.name})));
    $('pick').append(og);
  });
  renderDash();
  $('sort-dash').addEventListener('change', renderDash);
}

function statusChip(s) {
  const diff = s.applicants - s.cap;
  if (s.status === '경쟁') return h('span', {class: 'chip risk', text: '경쟁 +' + diff});
  if (s.status === '미달') return h('span', {class: 'chip open', text: '미달 ' + diff});
  if (s.status === '정원 충족') return h('span', {class: 'chip edge', text: '정원 충족'});
  return h('span', {class: 'chip hard', text: s.status});
}

function genderTag(s) {
  if (s.gender === '여') return h('span', {class: 'tag g', text: '여학생만'});
  if (s.gender === '남') return h('span', {class: 'tag g', text: '남학생만'});
  return null;
}


/* 상세: 분포·핵심 숫자·내 점수 위치 */
const OPEN = new Set();
function quant(desc, q) { // desc: 내림차순. 상위 q(0~1) 지점 점수
  if (!desc.length) return null;
  const i = Math.min(desc.length - 1, Math.max(0, Math.ceil(desc.length * q) - 1));
  return desc[i];
}
function detailBox(s) {
  const box = h('div', {class: 'detail'});
  const pr = DATA.progress || {};
  if (pr.total && pr.done < pr.total) {
    box.append(h('div', {class: 'warn', text: '입력 ' + pr.done + '/' + pr.total + '학급 기준입니다. 아직 입력되지 않은 반이 있어 실제와 다를 수 있습니다.'}));
  }
  const desc = s.scores.slice().sort((a, b) => b - a);
  const n = desc.length;
  const avg = desc.reduce((a, b) => a + b, 0) / n;
  const kp = (l, v) => h('div', {class: 'kpi'}, h('span', {text: l}), h('b', {text: fmt(v)}));
  box.append(h('h4', {text: '지원자 ' + n + '명의 점수'}),
    h('div', {class: 'kpis'}, kp('최고', desc[0]), kp('상위 25%', quant(desc, .25)), kp('중앙값', quant(desc, .5)), kp('하위 25%', quant(desc, .75)), kp('평균', avg)));

  // 히스토그램 (10점 단위)
  const W = 10, lo = Math.floor(desc[n - 1] / W) * W, hi = Math.floor(desc[0] / W) * W;
  const bins = [];
  for (let b = lo; b <= hi; b += W) bins.push({b, c: 0});
  desc.forEach(v => bins[Math.floor((v - lo) / W)].c++);
  const mx = Math.max(...bins.map(x => x.c));
  const cut = s.cutline;
  const hist = h('div', {class: 'hist', role: 'img', 'aria-label': '점수대별 지원자 수'});
  const xs = h('div', {class: 'hx', 'aria-hidden': 'true'});
  const els = bins.map(x => {
    const inside = cut != null && x.b + W > cut; // 컷라인 이상이 들어 있는 구간
    const e = h('div', {class: 'hb' + (inside ? ' in' : '')},
      h('s', {text: x.c || ''}), h('u', {style: 'height:' + (x.c ? Math.max(4, x.c / mx * 64) : 0) + 'px'}));
    hist.append(e); xs.append(h('span', {text: x.b}));
    return e;
  });
  box.append(h('h4', {text: '점수대별 분포 (10점 단위, 막대 아래 숫자는 구간 시작 점수)'}), hist, xs,
    h('div', {class: 'hl'}, h('i', {style: 'background:var(--brand)'}), s.status === '미달' ? '지원자 전체가 정원 안' : '컷라인 이상 구간',
      '  ', h('i', {style: 'background:#C9D6DD;margin-left:8px'}), '컷라인 미만 구간'));

  // 내 점수
  const out = h('span', {class: 'out'});
  const inp = h('input', {type: 'text', inputmode: 'decimal', placeholder: '학생 점수', 'aria-label': '학생 점수'});
  const run = () => {
    els.forEach(e => e.classList.remove('me'));
    out.textContent = '';
    const t = inp.value.trim().replace(',', '.');
    if (!t) return;
    const v = Number(t);
    if (!isFinite(v) || v < DATA.min || v > DATA.max) { out.textContent = DATA.min + '~' + DATA.max + ' 사이 숫자를 입력하세요.'; return; }
    const j = judge(s, v);
    const bi = Math.floor((v - lo) / W);
    if (bi >= 0 && bi < els.length) els[bi].classList.add('me');
    out.append(j.rank ? h('span', {}, '현재 ', h('b', {text: j.rank + '등'}), ' / 정원 ' + fmt(s.cap) + ' · ') : '', h('span', {class: 'chip ' + j.cls, text: j.label}));
  };
  inp.addEventListener('input', run);
  box.append(h('h4', {text: '이 학생 점수는 어디쯤?'}), h('div', {class: 'mine'}, inp, out),
    h('p', {class: 'hint', text: '입력한 점수는 저장되지 않습니다. 1지망 현황이며 이후 변동될 수 있습니다.'}));
  return box;
}

function schoolCard(s, title) {
  const ratio = s.cap ? s.applicants / s.cap : 0;
  const tags = [genderTag(s)];
  if (s.total && Number(s.total) !== Number(s.cap)) tags.push(h('span', {class: 'tag', text: '전체 모집 ' + s.total + '명 (특별전형 포함)'}));
  if (s.note) tags.push(h('span', {class: 'tag', text: s.note}));
  const cutRow = s.hidden
    ? h('div', {class: 'hide-note', text: '지원자가 적어(' + (DATA.minShow || 10) + '명 미만) 컷라인과 점수는 공개하지 않습니다. 정원에 못 미치므로 지원 가능한 상태입니다.'})
    : h('div', {class: 'cutrow'},
        h('span', {class: 'cutlabel', text: '컷라인'}),
        h('span', {class: 'cut' + (s.cutline == null ? ' none' : ''), text: s.cutline == null ? '지원자 없음' : fmt(s.cutline)}),
        s.tie > 1 ? h('span', {class: 'tie', text: '동점 ' + s.tie + '명'}) : '');
  const card = h('div', {class: 'card'});
  const canOpen = !s.hidden && s.scores && s.scores.length;
  let det = null;
  const toggle = () => {
    const open = card.classList.toggle('open-d');
    if (open && !det) { det = detailBox(s); card.append(det); }
    if (det) det.hidden = !open;
    btn.setAttribute('aria-expanded', open); btn.firstChild.textContent = open ? '접기 ' : '지원 현황·점수 분포 ';
    open ? OPEN.add(s.name) : OPEN.delete(s.name);
  };
  const btn = canOpen ? h('button', {class: 'more', type: 'button', 'aria-expanded': 'false'}, h('span', {text: '지원 현황·점수 분포 '}), h('i', {text: '▾'})) : null;
  if (btn) btn.addEventListener('click', toggle);
  card.append(
    h('div', {class: 'card-top'}, h('div', {class: 'name', text: title || s.name}), statusChip(s)),
    cutRow,
    h('div', {class: 'stats'},
      h('span', {}, '정원 ', h('b', {text: fmt(s.cap)})),
      h('span', {}, '지원 ', h('b', {text: fmt(s.applicants)})),
      h('span', {}, '지원율 ', h('b', {text: Math.round(ratio * 100) + '%'}))),
    h('div', {class: 'bar', 'aria-hidden': 'true'},
      h('span', {class: ratio > 1 ? 'over' : '', style: 'width:' + Math.min(ratio / 1.5, 1) * 100 + '%'}), h('em')),
    tags.filter(Boolean).length ? h('div', {class: 'tags'}, tags.filter(Boolean)) : '', btn || '');
  if (btn && OPEN.has(s.name)) toggle();
  return card;
}

function sortList(list, mode) {
  const l = list.slice();
  if (mode === 'cut') l.sort((a, b) => (b.cutline ?? -1) - (a.cutline ?? -1));
  if (mode === 'rate') l.sort((a, b) => (b.applicants / (b.cap || 1)) - (a.applicants / (a.cap || 1)));
  return l;
}

function renderDash() {
  const mode = $('sort-dash').value;
  const box = $('dash'); box.textContent = '';
  const cols = h('div', {class: 'cols'});
  box.append(cols);
  zonesOf(DATA.schools).forEach(z => {
    const sec = h('div', {class: 'zone', 'data-z': z.key},
      h('div', {class: 'zone-head'}, h('h2', {text: z.title}), z.apply ? h('span', {class: 'when', text: '원서접수 ' + z.apply}) : ''));
    if (z.note) sec.append(h('p', {class: 'zone-note', text: z.note}));
    if (z.key === '특성화') {
      // 학교별로 묶고 그 안에 학과 카드
      const groups = new Map();
      z.list.forEach(s => {
        const i = s.name.indexOf(' ');
        const school = i > 0 ? s.name.slice(0, i) : s.name;
        const dept = i > 0 ? s.name.slice(i + 1) : s.name;
        if (!groups.has(school)) groups.set(school, []);
        groups.get(school).push({s, dept});
      });
      groups.forEach((arr, school) => {
        sec.append(h('div', {class: 'sub', text: school}));
        const sorted = sortList(arr.map(x => x.s), mode);
        sorted.forEach(s => sec.append(schoolCard(s, arr.find(x => x.s === s).dept)));
      });
    } else {
      sortList(z.list, mode).forEach(s => sec.append(schoolCard(s)));
    }
    cols.append(sec);
  });
}

/* 판정: 정원 대비 예상 등위 비율 */
function judge(s, score) {
  if (s.hidden || s.applicants < s.cap) return {rank: null, label: '지원 가능', cls: 'open', key: -1};
  const rank = s.scores.filter(x => x > score).length + 1;
  const base = {rank: rank, ratio: s.cap ? rank / s.cap : 0};
  if (rank <= s.cap * SAFE_RATIO) return {...base, label: '안정', cls: 'safe', key: base.ratio};
  if (rank <= s.cap) return {...base, label: '소신', cls: 'edge', key: base.ratio};
  if (rank <= s.cap * RISK_RATIO) return {...base, label: '위험', cls: 'risk', key: base.ratio};
  return {...base, label: '어려움', cls: 'hard', key: base.ratio};
}

function parseInput(text) {
  const out = [], errs = [];
  let n = 0;
  text.split(/\r?\n/).forEach((line, i) => {
    const t = line.trim(); if (!t) return;
    n++;
    const tok = t.split(/[\s,\t]+/);
    const score = Number(tok[tok.length - 1].replace(/,/g, ''));
    if (isNaN(score)) { errs.push((i + 1) + '번째 줄: 점수를 숫자로 입력하세요 (' + t + ')'); return; }
    if (score < DATA.min || score > DATA.max) { errs.push((i + 1) + '번째 줄: 점수는 ' + DATA.min + '~' + DATA.max + ' 사이여야 합니다 (' + t + ')'); return; }
    out.push({label: tok.length > 1 ? tok.slice(0, -1).join(' ') : '입력 ' + n, score: score});
  });
  return {out, errs};
}

$('go').addEventListener('click', () => {
  const {out, errs} = parseInput($('scores').value);
  $('look-err').textContent = errs.length ? errs.join(' / ') : (out.length ? '' : '점수를 한 줄 이상 입력하세요.');
  const box = $('results'); box.textContent = '';
  if (!out.length) return;
  const pick = $('pick').value, mode = $('sort-look').value;
  out.forEach(st => {
    const cols = h('div', {class: 'cols'});
    zonesOf(DATA.schools).forEach(z => {
      const res = h('div', {class: 'res'});
      cols.append(res);
      const rows = z.list.map(s => ({s, j: judge(s, st.score)}));
      rows.sort((a, b) => {
        if (pick) { if (a.s.name === pick) return -1; if (b.s.name === pick) return 1; }
        return mode === 'cut' ? (b.s.cutline ?? -1) - (a.s.cutline ?? -1) : a.j.key - b.j.key;
      });
      res.append(h('div', {class: 'zh', text: z.title + (z.apply ? ' · 원서접수 ' + z.apply : '')}));
      rows.forEach(({s, j}) => {
        const d = s.cutline == null ? null : st.score - s.cutline;
        const sub = j.rank == null
          ? '지원 ' + fmt(s.applicants) + '명 / 정원 ' + fmt(s.cap)
          : '예상 ' + j.rank + '등 / 정원 ' + fmt(s.cap) + ' · 컷라인 ' + fmt(s.cutline);
        const g = genderTag(s);
        res.append(h('div', {class: 'li' + (s.name === pick ? ' pick' : '')},
          h('div', {class: 'l'}, h('div', {class: 'n', text: s.name}), h('div', {class: 's', text: sub + (g ? ' · ' + g.textContent : '')})),
          h('div', {class: 'r'},
            h('span', {class: 'chip ' + j.cls, text: j.label}),
            d == null ? '' : h('div', {class: 'd ' + (d >= 0 ? 'pos' : 'neg'), text: '컷라인 ' + (d >= 0 ? '+' : '') + fmt(d)}))));
      });
    });
    box.append(h('div', {class: 'student'}, h('h2', {}, st.label, h('span', {text: fmt(st.score) + '점'})), cols));
  });
  box.append(h('p', {class: 'legend', text: '판정 기준: 정원의 95% 안쪽이면 안정, 정원 안쪽이면 소신, 정원의 105%까지는 위험, 그 밖은 어려움. 지원자가 정원보다 적은 곳은 지원 가능으로 표시합니다. 특성화고의 취업희망자 특별전형은 반영되지 않습니다.'}));
});

/* 탭 */
const tabs = [['tab-dash', 'p-dash'], ['tab-look', 'p-look']];
tabs.forEach(([t, p]) => $(t).addEventListener('click', () => {
  tabs.forEach(([t2, p2]) => { $(t2).setAttribute('aria-selected', t2 === t); $(p2).hidden = p2 !== p; });
}));
</script>
